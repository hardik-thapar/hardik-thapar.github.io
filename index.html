<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hardik Thapar</title>
  <meta name="description" content="Hardik Thapar. Software engineer working on backend systems, from job queues that survive crashes to the data pipelines behind ML research." />
  <meta name="theme-color" content="#f1f1ee" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f1f1ee;
      --ink: #0c0c0c;
      --body: #6f6f6c;
      --muted: #9c9c98;
      --wordmark: #efefeb;
      --mist: #e2e3f1;
      --font: "Inter", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    a { color: inherit; text-decoration: none; }
    ul { margin: 0; padding: 0; list-style: none; }
    h2, h3, p { margin: 0; }
    a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 3px; }

    .footer {
      --u: min(100vw / 1440, 100vh / 672);
      --u: min(100vw / 1440, 100svh / 672);
      position: relative; height: 100vh; height: 100svh;
      background: var(--paper); overflow: hidden; isolation: isolate;
    }

    /* stage */
    .footer__stage { position: absolute; inset: 0; z-index: 0; }
    .footer__video { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 100%; transform: translateY(9%); }
    .footer__stage::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(to bottom, var(--paper) 0%, rgb(241 241 238 / .96) 26%, rgb(241 241 238 / .72) 44%, rgb(241 241 238 / 0) 70%);
    }

    /* wordmark */
    .footer__wordmark {
      position: absolute; left: 50%; bottom: calc(64 * var(--u) - 0.24em); padding: 0.1em 0.04em 0.24em; transform: translateX(-50%); z-index: 1; margin: 0;
      font-size: calc(165 * var(--u)); font-weight: 600; line-height: .74; letter-spacing: -0.045em; white-space: nowrap;
      pointer-events: none; user-select: none;
      color: rgb(232 234 250 / .4);
      background: linear-gradient(to bottom, rgb(255 255 255 / .78), rgb(214 218 246 / .36) 48%, rgb(255 255 255 / .62));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 calc(-1 * var(--u)) 0 rgb(255 255 255 / .55)) drop-shadow(0 0 calc(18 * var(--u)) rgb(190 200 255 / .45));
    }

    /* fog */
    .footer__fog {
      position: absolute; inset: auto 0 0; z-index: 2; height: 17%; pointer-events: none;
      background: linear-gradient(to top, var(--mist) 0%, rgb(226 227 241 / .6) 30%, rgb(226 227 241 / 0) 100%);
    }

    /* content */
    .footer__content {
      position: relative; z-index: 3;
      width: calc(1440 * var(--u)); margin: 0 auto;
      padding: calc(64 * var(--u)) calc(120 * var(--u)) 0;
    }
    .cols { display: grid; grid-template-columns: calc(400 * var(--u)) repeat(3, auto); justify-content: space-between; column-gap: calc(48 * var(--u)); align-items: start; }
    .lead__title { font-size: calc(22 * var(--u)); font-weight: 600; line-height: 1.2; letter-spacing: -0.04em; max-width: calc(380 * var(--u)); }
    .lead__text { margin-top: calc(14 * var(--u)); max-width: calc(380 * var(--u)); color: #4a4a47; font-size: calc(13.4 * var(--u)); line-height: 1.5; letter-spacing: -0.01em; }
    .lead__text + .lead__text { margin-top: calc(8 * var(--u)); }
    .col__title { font-size: calc(18 * var(--u)); font-weight: 500; line-height: 1; letter-spacing: -0.03em; }
    .col__list { display: grid; gap: calc(9 * var(--u)); margin-top: calc(16 * var(--u)); font-size: calc(13.2 * var(--u)); line-height: 1.3; letter-spacing: -0.005em; color: #4f4f4c; white-space: nowrap; }
    .col__list a { transition: opacity .2s ease; }
    .col__list a:hover { opacity: .55; }
    .col__more { color: var(--muted); }

    .rule { height: 1px; background: rgb(12 12 12 / .18); margin: calc(44 * var(--u)) 0 calc(40 * var(--u)); }

    .bottom { display: flex; justify-content: flex-start; align-items: flex-start; }

    .socials { min-width: calc(220 * var(--u)); }
    .socials__title { font-size: calc(22 * var(--u)); font-weight: 500; line-height: 1; letter-spacing: -0.035em; }
    .socials__list { display: flex; align-items: center; gap: calc(18 * var(--u)); margin-top: calc(16 * var(--u)); }
    .socials__cv { display: inline-flex !important; align-items: center; width: auto !important; height: calc(26 * var(--u)) !important; font-size: calc(15 * var(--u)); font-weight: 500; letter-spacing: -0.02em; margin-left: calc(6 * var(--u)); }
    .socials__list a { display: block; width: calc(26 * var(--u)); height: calc(26 * var(--u)); color: var(--ink); transition: opacity .2s ease; }
    .socials__list a:hover { opacity: .55; }
    .socials__list svg { display: block; width: 100%; height: 100%; fill: currentColor; }

    /* tablet */
    @media (min-width: 768px) and (max-width: 1023px) {
      .footer { --u: min(100vw / 1040, 100svh / 672); }
      .footer__content { width: calc(1040 * var(--u)); padding: calc(56 * var(--u)) calc(40 * var(--u)) 0; }
      .cols { column-gap: calc(34 * var(--u)); }
      .footer__wordmark { font-size: calc(120 * var(--u)); bottom: calc(48 * var(--u)); }
    }

    /* mobile */
    @media (max-width: 767px) {
      .footer { --u: 1px; display: flex; flex-direction: column; height: auto; min-height: 100svh; }
      .footer__stage::after { background: linear-gradient(to bottom, var(--paper) 0%, rgb(241 241 238 / .95) 50%, rgb(241 241 238 / .8) 68%, rgb(241 241 238 / 0) 90%); }
      .footer__content { width: 100%; padding: 36px 20px 0; margin-bottom: max(34vw, 150px); }
      .cols { grid-template-columns: 1fr 1fr; row-gap: 28px; column-gap: 16px; }
      .lead { grid-column: 1 / -1; }
      .lead__title { font-size: 22px; max-width: 100%; }
      .lead__text { font-size: 14px; max-width: 100%; }
      .col__title { font-size: 16px; }
      .col__list { font-size: 13px; gap: 10px; margin-top: 12px; white-space: normal; }
      .rule { margin: 32px 0 28px; }
      .socials__cv { height: 24px !important; font-size: 15px; }
      .socials { min-width: 0; }
      .socials__title { font-size: 18px; }
      .socials__list a { width: 24px; height: 24px; }
      .footer__wordmark { bottom: 9vw; font-size: 11.5vw; }
      .footer__fog { height: 7%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .socials__cv, .col__list a { transition: none; }
    }
  </style>
</head>
<body data-page="home">
  <main class="footer">
    <div class="footer__stage" aria-hidden="true">
      <video class="footer__video"
        src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/4d01c727-d9c5-47c8-a778-35a451ffd39f.mp4"
        poster="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261014_121838_c97d0940-f430-4304-8573-4f47ee44f447.png"
        autoplay muted loop playsinline preload="auto"></video>
    </div>

    <p class="footer__wordmark" aria-hidden="true" data-wordmark>Hardik Thapar</p>
    <div class="footer__fog" aria-hidden="true"></div>

    <div class="footer__content">
      <div class="cols">
        <div class="col lead">
          <h2 class="lead__title" data-home-title></h2>
          <div data-home-text></div>
        </div>
        <nav class="col" aria-label="Projects">
          <h3 class="col__title">Projects</h3>
          <ul class="col__list" data-col-projects></ul>
        </nav>
        <nav class="col" aria-label="Writeups">
          <h3 class="col__title">Writeups</h3>
          <ul class="col__list" data-col-writeups></ul>
        </nav>
        <div class="col">
          <h3 class="col__title">Recognition</h3>
          <ul class="col__list" data-col-recognition></ul>
        </div>
      </div>

      <div class="rule" aria-hidden="true"></div>

      <div class="bottom">
        <div class="socials">
          <h3 class="socials__title">Socials</h3>
          <ul class="socials__list" data-socials></ul>
        </div>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
