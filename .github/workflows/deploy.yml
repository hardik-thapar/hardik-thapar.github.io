name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main   # triggers on every push to main

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare versioned site artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R site/. _site/
          for file in _site/*.html; do
            sed -i "s|src=\"data.js\"|src=\"data.js?v=${GITHUB_SHA}\"|g; s|src=\"main.js\"|src=\"main.js?v=${GITHUB_SHA}\"|g" "$file"
          done

      # Upload only the site/ subfolder as the Pages artifact
      - name: Upload site folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
